# VRRP health check script — adjust path as needed
vrrp_script chk_mysql {
    script "/usr/local/bin/check_mysql.sh"
    interval 3
    timeout 2
    fall 3
    rise 2
}

# Replica node configuration
# CHANGE: interface, unicast_src_ip, unicast_peer, virtual_ipaddress
vrrp_instance VI_MYSQL {
    state BACKUP
    interface eth0
    virtual_router_id 51
    priority 90
    advert_int 1

    # Docker bridge doesn't support VRRP multicast — use unicast
    unicast_src_ip 172.18.0.3   # ← this node's IP
    unicast_peer {
        172.18.0.2              # ← primary node's IP
    }

    virtual_ipaddress {
        172.18.0.100/16 dev eth0  # ← shared VIP (same as primary)
    }

    track_script {
        chk_mysql
    }

    notify_master "/etc/keepalived/notify.sh master"
    notify_backup "/etc/keepalived/notify.sh backup"
    notify_fault  "/etc/keepalived/notify.sh fault"
}
